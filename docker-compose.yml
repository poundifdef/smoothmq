version: '3.8'

services:
  smoothmq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smoothmq
    ports:
      - "8080:8080"  # Unified port (Dashboard at /, SQS at /sqs)
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Optional: mount config file (or use environment variables)
      - ./config.yaml:/app/config.yaml:ro
    environment:
      # SQLite database path inside the container
      - Q_SQLITE_PATH=/app/data/smoothmq.sqlite
      # SQS Keys in format "access_key:secret_key"
      # This will check Q_SQS_KEYS first, then try to build it from DEV_ vars,
      # and finally fall back to the defaults if nothing is set.
      - Q_SQS_KEYS=${Q_SQS_KEYS:-${DEV_ACCESS_KEY_ID:-DEV_ACCESS_KEY_ID}:${DEV_SECRET_ACCESS_KEY:-DEV_SECRET_ACCESS_KEY}}
      # Dashboard credentials
      - Q_DASHBOARD_USER=${Q_DASHBOARD_USER:-admin}
      - Q_DASHBOARD_PASS=${Q_DASHBOARD_PASS:-password}
      # Single port mode configuration
      - Q_SERVER_USE_SINGLE_PORT=true
      - PORT=8080
      # Logging configuration - set to "debug" or "trace" for more verbose logs
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_PRETTY=${LOG_PRETTY:-true}
    command: ["run-app", "server", "--config", "/app/config.yaml"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    working_dir: /app
    restart: unless-stopped
    # Optional: Add healthcheck if you install curl/wget in Dockerfile
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000"] || exit 0
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s

